name: Remote execution qualification

on:
  push:
    branches: [feat/full-superagent-architecture]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification scope
        type: choice
        options: [full, resources, storage]
        default: full

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'storage'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the confined runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep openssh-server
          sudo install -d -m 0755 /run/sshd
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          echo /usr/local/bin >> "$GITHUB_PATH"
          npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Harness for real endpoint launch qualification
        if: github.event_name != 'workflow_dispatch' || inputs.scope != 'resources'
        run: |
          npm install --prefix "$RUNNER_TEMP/agentic-endpoint-harness" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.3
          echo "DSH_ENDPOINT_QUALIFICATION_CLI=$RUNNER_TEMP/agentic-endpoint-harness/node_modules/.bin/dsh" >> "$GITHUB_ENV"
          echo "DSH_ABLITERATION_ADAPTER_PACKAGE=$RUNNER_TEMP/agentic-endpoint-harness/node_modules/@deepseek-ai/dsh-llm-pi-ai" >> "$GITHUB_ENV"
      - name: Check selected scope with native confinement enabled
        env:
          QUALIFICATION_SCOPE: ${{ inputs.scope }}
        run: |
          pnpm typecheck
          pnpm build
          qualification_tests=(pnpm test --maxWorkers=4)
          if [[ "$QUALIFICATION_SCOPE" == resources ]]; then
            qualification_tests=(pnpm exec vitest run tests/remote-resources.spec.ts tests/resource-worker.spec.ts)
          fi
          sudo systemd-run --wait --pipe --collect --service-type=exec \
            --unit="agentic-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --property='Delegate=cpu memory pids' \
            --property="WorkingDirectory=$PWD" --setenv="PATH=$PATH" \
            --setenv=DSH_REMOTE_ISOLATION=1 --setenv=DSH_ENDPOINT_LAUNCHER_QUALIFICATION=1 --setenv=DSH_SSH_TRANSPORT_QUALIFICATION=1 \
            --setenv=DSH_PUBLICATION_HARNESS_QUALIFICATION=1 --setenv=DSH_WATCHDOG_PROCESS_QUALIFICATION=1 \
            --setenv=DSH_EXECUTOR_RECOVERY_QUALIFICATION=1 --setenv=DSH_SUPERVISION_EVALUATION_QUALIFICATION=1 \
            --setenv=DSH_SUPERVISION_ENDURANCE_QUALIFICATION=1 --setenv=DSH_EXECUTOR_STOP_QUALIFICATION=1 \
            --setenv="DSH_ABLITERATION_ADAPTER_PACKAGE=$DSH_ABLITERATION_ADAPTER_PACKAGE" \
            --setenv="DSH_ENDPOINT_QUALIFICATION_CLI=$DSH_ENDPOINT_QUALIFICATION_CLI" \
            /bin/bash "$PWD/tests/fixtures/resource-qualification.sh" "${qualification_tests[@]}"
      - name: Qualify native services and SSH transport with pinned Harness
        if: github.event_name != 'workflow_dispatch' || inputs.scope != 'resources'
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo install -d -m 0755 "/run/systemd/system/user@$(id -u).service.d"
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "/run/systemd/system/user@$(id -u).service.d/90-agentic-qualification.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          # This is a disposable CI runner. Restart only its test user manager after changing delegation.
          qualification_old_group=$(systemctl show "user@$(id -u).service" --property=ControlGroup --value)
          sudo systemctl stop "user@$(id -u).service"
          if [[ -n $qualification_old_group ]]; then
            [[ $qualification_old_group == /user.slice/* && $qualification_old_group != *..* ]]
            for ((qualification_wait=0; qualification_wait<150; qualification_wait++)); do
              [[ ! -e /sys/fs/cgroup${qualification_old_group} ]] && break
              sleep 0.2
            done
            [[ ! -e /sys/fs/cgroup${qualification_old_group} ]]
          fi
          sudo systemctl start "user@$(id -u).service"
          systemctl --user show --property=ControlGroup --value
          DSH_DELEGATED_SERVICE_QUALIFICATION=1 DSH_NATIVE_SERVICE_QUALIFICATION=1 DSH_INSTALLED_SERVICE_QUALIFICATION=1 \
            DSH_SSH_TRANSPORT_QUALIFICATION=1 DSH_SERVICE_QUALIFICATION_CLI="$DSH_ENDPOINT_QUALIFICATION_CLI" \
            pnpm exec vitest run tests/delegated-service.spec.ts tests/launcher-service.spec.ts tests/transport-launcher.spec.ts

  storage:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'storage'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies for the Harness probe
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Install pinned Harness for storage launcher qualification
        run: |
          npm install --prefix "$RUNNER_TEMP/agentic-storage-harness" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.3
          echo "DSH_ENDPOINT_QUALIFICATION_CLI=$RUNNER_TEMP/agentic-storage-harness/node_modules/.bin/dsh" >> "$GITHUB_ENV"
      - name: Install filesystem investigation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xfsprogs bubblewrap openssh-server
          sudo install -d -m 0755 /run/sshd
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Exercise disposable XFS project quotas
        run: sudo env GITHUB_ACTIONS=true PATH="$PATH" DSH_ENDPOINT_QUALIFICATION_CLI="$DSH_ENDPOINT_QUALIFICATION_CLI" bash tests/fixtures/storage-qualification.sh "$(id -u)" "$(id -g)"
