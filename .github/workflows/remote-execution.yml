name: Remote execution qualification

on:
  push:
    branches: [feat/full-superagent-architecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the confined runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          echo /usr/local/bin >> "$GITHUB_PATH"
          npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Harness for real endpoint launch qualification
        run: |
          npm install --prefix "$RUNNER_TEMP/agentic-endpoint-harness" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.3
          echo "DSH_ENDPOINT_QUALIFICATION_CLI=$RUNNER_TEMP/agentic-endpoint-harness/node_modules/.bin/dsh" >> "$GITHUB_ENV"
      - name: Check the complete suite with native confinement enabled
        run: |
          pnpm typecheck
          pnpm build
          sudo systemd-run --wait --pipe --collect --service-type=exec \
            --unit="agentic-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --property='Delegate=cpu memory pids' \
            --property="WorkingDirectory=$PWD" --setenv="PATH=$PATH" \
            --setenv=DSH_REMOTE_ISOLATION=1 --setenv=DSH_ENDPOINT_LAUNCHER_QUALIFICATION=1 \
            --setenv="DSH_ENDPOINT_QUALIFICATION_CLI=$DSH_ENDPOINT_QUALIFICATION_CLI" \
            /bin/bash "$PWD/tests/fixtures/resource-qualification.sh" pnpm test
      - name: Qualify delegated user-service endpoint with pinned Harness
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo install -d -m 0755 "/run/systemd/system/user@$(id -u).service.d"
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "/run/systemd/system/user@$(id -u).service.d/90-agentic-qualification.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          # This is a disposable CI runner. Restart only its test user manager after changing delegation.
          sudo systemctl restart "user@$(id -u).service"
          systemctl --user show init.scope --property=ControlGroup --value
          DSH_DELEGATED_SERVICE_QUALIFICATION=1 pnpm exec vitest run tests/delegated-service.spec.ts
